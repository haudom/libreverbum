# Projektgerüst — Begründung in technik.md §6, „Projektgerüst und Werkzeuge".
# Die Fassungen sind eng gefasst: Auf ihnen beruhen die Messungen zu Entscheidung 5.

[project]
name = "libreverbum"
version = "0.1.0"
description = "Bereitet den Wortschatz eines Buchkapitels vor dem Lesen auf"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8,<3.9",
    # Das Modell liegt nicht auf PyPI. Die Prüfsumme hängt an der Adresse, damit
    # Entscheidung 5 an genau diesem Artefakt reproduzierbar bleibt.
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl#sha256=5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310",
    # E8b, entschieden 21.08.2026: MIT-lizenziert, dreifach belegt (PyPI-Metadaten,
    # LICENSE.txt im Quellbaum, GitHubs Lizenz-API). Note.guid ist Property mit Getter
    # und Setter samt Konstruktorparameter — das Ausschlusskriterium aus bauplan.md
    # Tor 0 (E8b) ist damit erfüllt.
    "genanki>=0.13,<0.14",
]

# REGEL (technik.md §1, „Architekturregel"): Der Kern kennt die Oberfläche nicht.
# Deshalb steht PySide6 nicht bei dependencies, sondern in einer eigenen Gruppe. Wer den
# Kern installiert, bekommt Qt nicht mit — die Trennung ist damit nicht bloß Absicht,
# sondern Zustand der Umgebung, und ein versehentlicher Import fällt sofort auf.
[project.optional-dependencies]
gui = ["PySide6>=6.11,<7"]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
    "pytest>=9.1,<10",
    "mypy>=2.3,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Ohne diese Einstellung sprengt ein abschließendes Komma jede mehrzeilige Sammlung in
# eine Zeile je Eintrag. Die kompakten Wortblöcke in tools/ würden dadurch hundertfach
# länger, ohne lesbarer zu werden.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# E501 bleibt bewusst an: Der Formatierer bricht Code um, aber keine Prosa. Die langen
# deutschen Docstrings aus dokumentation.md §3 fielen sonst durch jede Prüfung.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

ignore = [
    # RUF001–003 halten Gedankenstrich und typografische Anführungszeichen für
    # verwechselbare Zeichen. In einem Projekt, dessen Kommentare und Docstrings
    # deutsche Prosa sind (dokumentation.md §1), meldet die Regel genau das als Fehler,
    # was die Sprachregel verlangt.
    "RUF001",
    "RUF002",
    "RUF003",
    # SIM905 will aus `"""be am is are …""".split()` ein Listenliteral machen. Aus einem
    # überschaubaren Wortblock würden mehrere hundert Zeilen.
    "SIM905",
]

[tool.ruff.lint.isort]
# Muss zu skip-magic-trailing-comma oben passen, sonst sortiert der Linter Importe
# anders, als der Formatierer sie anschließend setzt.
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
# "cli" seit T16 (bauplan.md): die Kommandozeile liegt bewusst neben dem Kern, nicht
# darunter (bauplan.md, „Die Kommandozeile ist eine Oberfläche…"), wird aber im selben
# Tor geprüft wie libreverbum und tests.
files = ["libreverbum", "tests", "cli"]

# REGEL (technik.md §6, Tor „Prüfen vor »fertig«"): genanki bringt weder Typangaben noch
# einen py.typed-Marker mit (geprüft am installierten Paket, 21.08.2026) — eng auf dieses
# eine Modul begrenzt, damit ein fehlendes Stub-Paket bei einer künftigen Abhängigkeit
# nicht versehentlich mit durchrutscht.
[[tool.mypy.overrides]]
module = "genanki.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `package = false` oben heißt: libreverbum wird nicht in die Umgebung installiert. Ohne
# diese Zeile findet blank aufgerufenes `pytest` das Paket deshalb nicht — nur
# `python -m pytest` täte es, weil das Verzeichnis dann ohnehin im Suchpfad steht. Das Tor
# in technik.md §6 nennt die Kurzform; sie soll auch die Form sein, die läuft.
pythonpath = ["."]
# Bauplan.md T2: Tests ohne die jeweilige Voraussetzung werden in tests/conftest.py
# übersprungen statt scheitern zu lassen; die Registrierung hier hält --strict-markers
# ruhig.
markers = [
    "needs_dictionary: benötigt die echte WikDict-Datenbank (tools/en-de.sqlite3)",
    "needs_model: benötigt einen erreichbaren, echten Modellserver (LIBREVERBUM_MODEL_URL)",
    "needs_epub: benötigt die echten EPUBs tools/sherlock.epub und tools/dorian_gray.epub",
]
